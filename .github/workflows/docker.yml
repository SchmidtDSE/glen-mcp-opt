name: Build Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Compute tags
        id: tags
        run: |
          repo=ghcr.io/schmidtdse/glen-mcp-opt
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tags=$repo:${{ github.ref_name }},$repo:${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "version=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$repo:main,$repo:${{ github.sha }}" >> "$GITHUB_OUTPUT"
            echo "version=main" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        id: build
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: APP_VERSION=${{ steps.tags.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke-test image
        run: |
          image="ghcr.io/schmidtdse/glen-mcp-opt@${{ steps.build.outputs.digest }}"
          docker run --rm "$image" python -c "from glen_opt.server import solve; r = solve({'variables': {'x': {'ub': 2}}, 'objective': {'sense': 'max', 'expr': 'x'}}); assert r['objective'] == 2, r; import duckdb; c = duckdb.connect(); c.sql('LOAD httpfs; LOAD h3'); print('OK')"
